<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#f7f2e7;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const P = { bg:'#f7f2e7', bgDeep:'#efe7d4', ink:'#8b3a2e', inkSoft:'#b8705f',
  gold:'#e6c063', goldHi:'#f4dd92', pink:'#e8b8b0', blue:'#9bb2c2', blueDeep:'#7a95a8',
  brain:'#e8a4a8', green:'#a3c088', text:'#5a4a42', textSoft:'#8b7a70', cream:'#fbf6ea' };
const clamp01 = x => x<0?0:x>1?1:x;
const phase = (t,s,d) => clamp01((t-s)/d);
const easeOut = x => 1-Math.pow(1-x,3);
const smooth = x => { x=clamp01(x); return x*x*(3-2*x); };
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function wobble(pts, seed=1, j=1.5){const rnd=mulberry32(seed);ctx.beginPath();const jp=pts.map(([x,y])=>[x+(rnd()-0.5)*j,y+(rnd()-0.5)*j]);ctx.moveTo(jp[0][0],jp[0][1]);for(let i=1;i<jp.length;i++){const [x0,y0]=jp[i-1],[x1,y1]=jp[i];ctx.quadraticCurveTo((x0+x1)/2+(rnd()-0.5)*j,(y0+y1)/2+(rnd()-0.5)*j,x1,y1);}ctx.stroke();}
function hLine(x0,y0,x1,y1,seed=1,j=1.3){wobble([[x0,y0],[x1,y1]],seed,j);}
function hCircle(cx,cy,r,seed=1,j=2,steps=40){const rnd=mulberry32(seed);const pts=[];for(let i=0;i<=steps;i++){const a=i/steps*Math.PI*2;const rr=r+(rnd()-0.5)*j;pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}wobble(pts,seed+1,0);}
function hEllipse(cx,cy,rx,ry,seed=1,j=2,steps=48){const rnd=mulberry32(seed);const pts=[];for(let i=0;i<=steps;i++){const a=i/steps*Math.PI*2;pts.push([cx+Math.cos(a)*(rx+(rnd()-0.5)*j),cy+Math.sin(a)*(ry+(rnd()-0.5)*j)]);}wobble(pts,seed+1,0);}
function setInk(w=2.4,color=P.ink){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.fillStyle=color;}
function withAlpha(a,fn){if(a<=0.001)return;ctx.save();ctx.globalAlpha=a;fn();ctx.restore();}
function drawLabel(text,x,y,alpha,opt={}){const{anchor='left',size=24,color=P.text,italic=true,leader=null}=opt;withAlpha(alpha,()=>{if(leader){ctx.save();setInk(1.4,P.textSoft);hLine(leader[0],leader[1],x,y,7,1);ctx.restore();}ctx.fillStyle=color;ctx.font=`${italic?'italic ':''}${size}px "Iowan Old Style", Georgia, serif`;ctx.textAlign=anchor;ctx.textBaseline='middle';ctx.fillText(text,x,y);});}
function drawApple(cx,cy,r,blur,alpha,seed=1){withAlpha(alpha,()=>{ctx.save();if(blur>0.5)ctx.filter=`blur(${blur}px)`;ctx.beginPath();ctx.moveTo(cx,cy-r*0.85);ctx.bezierCurveTo(cx+r*1.15,cy-r*1.1,cx+r*1.05,cy+r*0.9,cx,cy+r);ctx.bezierCurveTo(cx-r*1.05,cy+r*0.9,cx-r*1.15,cy-r*1.1,cx,cy-r*0.85);ctx.closePath();const g=ctx.createRadialGradient(cx-r*0.3,cy-r*0.4,r*0.1,cx,cy,r*1.1);g.addColorStop(0,'#e8664a');g.addColorStop(0.6,'#c8422c');g.addColorStop(1,'#8e2a1c');ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.ellipse(cx-r*0.35,cy-r*0.35,r*0.2,r*0.34,-0.4,0,Math.PI*2);ctx.fillStyle='rgba(255,240,220,0.5)';ctx.fill();ctx.strokeStyle='#5a3a24';ctx.lineWidth=r*0.075;ctx.beginPath();ctx.moveTo(cx,cy-r*0.85);ctx.quadraticCurveTo(cx+r*0.08,cy-r*1.15,cx+r*0.15,cy-r*1.25);ctx.stroke();ctx.beginPath();ctx.ellipse(cx+r*0.3,cy-r*1.05,r*0.22,r*0.1,-0.5,0,Math.PI*2);ctx.fillStyle='#6f9a4a';ctx.fill();ctx.restore();});}
function drawHeadAndEye(cx,cy,s,alpha){withAlpha(alpha,()=>{ctx.save();setInk(2.6,P.ink);ctx.beginPath();ctx.moveTo(cx-s*0.9,cy-s*1.2);ctx.quadraticCurveTo(cx+s*0.4,cy-s*1.35,cx+s*0.75,cy-s*0.55);ctx.quadraticCurveTo(cx+s*1.05,cy-s*0.15,cx+s*0.9,cy+s*0.15);ctx.quadraticCurveTo(cx+s*0.72,cy+s*0.25,cx+s*0.78,cy+s*0.4);ctx.quadraticCurveTo(cx+s*0.95,cy+s*0.6,cx+s*0.72,cy+s*0.75);ctx.quadraticCurveTo(cx+s*0.52,cy+s*0.85,cx+s*0.56,cy+s*1.0);ctx.quadraticCurveTo(cx+s*0.5,cy+s*1.18,cx+s*0.25,cy+s*1.22);ctx.quadraticCurveTo(cx-s*0.3,cy+s*1.28,cx-s*0.9,cy+s*1.2);ctx.stroke();const ex=cx+s*0.32,ey=cy-s*0.15;hCircle(ex,ey,s*0.34,3,2.4);hCircle(ex,ey,s*0.14,4,1.8);setInk(2.4,P.ink);ctx.beginPath();ctx.arc(ex-s*0.34,ey,s*0.22,-Math.PI*0.55,Math.PI*0.55);ctx.stroke();ctx.restore();});}
function drawCorneaArc(cx,cy,s,alpha,opt={}){const hi=opt.highlight;withAlpha(alpha,()=>{ctx.save();setInk(hi?3.4:2.4,hi?P.ink:P.inkSoft);ctx.beginPath();ctx.arc(cx,cy,s,-Math.PI*0.55,Math.PI*0.55);ctx.stroke();ctx.restore();});}
function drawLens(cx,cy,rx,ry,alpha,opt={}){const{glow=0,clear=true}=opt;withAlpha(alpha,()=>{ctx.save();ctx.beginPath();ctx.moveTo(cx,cy-ry);ctx.bezierCurveTo(cx+rx*1.35,cy-ry*0.4,cx+rx*1.35,cy+ry*0.4,cx,cy+ry);ctx.bezierCurveTo(cx-rx*1.35,cy+ry*0.4,cx-rx*1.35,cy-ry*0.4,cx,cy-ry);ctx.closePath();const g=ctx.createRadialGradient(cx-rx*0.25,cy-ry*0.35,rx*0.1,cx,cy,rx*1.4);if(clear){g.addColorStop(0,'rgba(255,244,236,0.95)');g.addColorStop(0.6,'rgba(240,220,210,0.8)');g.addColorStop(1,'rgba(216,180,168,0.75)');}else{g.addColorStop(0,'rgba(255,250,235,0.9)');g.addColorStop(0.5,'rgba(240,225,200,0.85)');g.addColorStop(1,'rgba(210,190,150,0.8)');}ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(139,58,46,0.55)';ctx.lineWidth=1.8;ctx.stroke();ctx.beginPath();ctx.ellipse(cx-rx*0.25,cy-ry*0.35,rx*0.18,ry*0.4,-0.25,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.55)';ctx.fill();if(glow>0){ctx.shadowColor='rgba(244,221,146,'+glow+')';ctx.shadowBlur=30*glow;ctx.strokeStyle='rgba(244,221,146,'+glow+')';ctx.stroke();}ctx.restore();});}
function drawRay(pts,alpha,color=P.gold,w=2.2){withAlpha(alpha,()=>{ctx.save();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.shadowColor=color;ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();ctx.restore();});}
function drawBrain(cx,cy,s,alpha,seed=1){withAlpha(alpha,()=>{ctx.save();hEllipse(cx,cy,s*1.15,s*0.9,seed,3,56);hEllipse(cx-s*0.15,cy-s*0.1,s*0.55,s*0.55,seed+2,2.4,40);hEllipse(cx+s*0.2,cy-s*0.15,s*0.5,s*0.55,seed+5,2.4,40);ctx.strokeStyle=P.inkSoft;ctx.lineWidth=1.6;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(cx-s*0.8+i*s*0.35,cy-s*0.7);ctx.quadraticCurveTo(cx-s*0.5+i*s*0.4,cy,cx-s*0.7+i*s*0.4,cy+s*0.7);ctx.stroke();}ctx.restore();});}
function drawLattice(cx,cy,size,disorder,alpha,seed=1){withAlpha(alpha,()=>{ctx.save();const n=7,step=size*2/n;const rnd=mulberry32(seed);for(let i=0;i<=n;i++){for(let j=0;j<=n;j++){const bx=cx-size+i*step,by=cy-size+j*step;const dx=(rnd()-0.5)*disorder*step*1.5;const dy=(rnd()-0.5)*disorder*step*1.5;const r=step*0.16*(1+disorder*0.4);ctx.beginPath();ctx.arc(bx+dx,by+dy,r,0,Math.PI*2);ctx.fillStyle=`rgba(155,178,194,${0.55+0.35*(1-disorder)})`;ctx.fill();if(disorder<0.6&&i<n&&j<n){ctx.strokeStyle=`rgba(122,149,168,${0.5*(1-disorder)})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx+dx,by+dy);ctx.lineTo(bx+step+dx,by+dy);ctx.moveTo(bx+dx,by+dy);ctx.lineTo(bx+dx,by+step+dy);ctx.stroke();}}}ctx.restore();});}
function drawClouds(cx,cy,r,alpha,seed=1){withAlpha(alpha,()=>{ctx.save();const rnd=mulberry32(seed);for(let i=0;i<40;i++){const a=rnd()*Math.PI*2,rr=rnd()*r*0.9;const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;const s=r*0.06+rnd()*r*0.12;const g=ctx.createRadialGradient(x,y,0,x,y,s);g.addColorStop(0,'rgba(255,252,244,0.9)');g.addColorStop(1,'rgba(230,210,180,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();}ctx.restore();});}
function drawScatter(cx,cy,r,progress,alpha){withAlpha(alpha,()=>{ctx.save();const n=5;for(let i=0;i<n;i++){const y=cy-r*0.6+i*(r*1.2/(n-1));drawRay([[cx-r*1.6,y],[cx-r*0.15,y]],progress,P.gold,2.2);}const rnd=mulberry32(11);const sp=smooth(progress);for(let i=0;i<n;i++){const y=cy-r*0.6+i*(r*1.2/(n-1));for(let k=0;k<3;k++){const ang=(rnd()-0.5)*1.2;const len=r*1.5*sp;drawRay([[cx+r*0.15,y],[cx+r*0.15+len*Math.cos(ang),y+len*Math.sin(ang)]],sp*0.9,P.gold,1.6);}}ctx.restore();});}
function drawHazyScene(progress,alpha){withAlpha(alpha,()=>{ctx.save();ctx.translate(960,540);setInk(2.2,P.inkSoft);for(let i=0;i<4;i++){const y=-200+i*140;hLine(-420,y,420,y,10+i,1.6);}const rnd=mulberry32(21);for(let i=0;i<4;i++){for(let j=0;j<6;j++){const x=-380+j*130+rnd()*10;const y=-200+i*140;const h=40+rnd()*40,w=28+rnd()*14;ctx.beginPath();ctx.rect(x-w/2,y-h,w,h);ctx.fillStyle=`rgba(180,150,120,${0.5+0.1*i})`;ctx.fill();ctx.strokeStyle='rgba(139,58,46,0.35)';ctx.lineWidth=1.2;ctx.stroke();}}const veil=smooth(progress);const g=ctx.createRadialGradient(0,0,80,0,0,700);g.addColorStop(0,`rgba(255,245,220,${0.15*veil})`);g.addColorStop(0.6,`rgba(245,235,210,${0.55*veil})`);g.addColorStop(1,`rgba(230,220,195,${0.85*veil})`);ctx.fillStyle=g;ctx.fillRect(-960,-540,1920,1080);ctx.strokeStyle=`rgba(255,250,220,${0.5*veil})`;ctx.lineWidth=8;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-300+i*220,-260);ctx.lineTo(-180+i*220,260);ctx.stroke();}ctx.restore();});}
function drawDevice(progress,alpha){withAlpha(alpha,()=>{ctx.save();ctx.translate(960,540);const p=smooth(progress);setInk(3,P.ink);ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-420,-260,840,520,24);else ctx.rect(-420,-260,840,520);ctx.stroke();ctx.beginPath();ctx.fillStyle='rgba(255,252,240,0.85)';ctx.fill();for(let i=1;i<=4;i++){ctx.beginPath();ctx.arc(0,0,20*i*(0.6+0.4*p),0,Math.PI*2);ctx.strokeStyle=`rgba(155,178,194,${0.5-0.08*i})`;ctx.lineWidth=1.4;ctx.stroke();}const g=smooth(Math.max(0,(p-0.6)/0.4));ctx.strokeStyle=`rgba(120,180,110,${g})`;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(-40,0);ctx.lineTo(-12,0);ctx.moveTo(12,0);ctx.lineTo(40,0);ctx.moveTo(0,-40);ctx.lineTo(0,-12);ctx.moveTo(0,12);ctx.lineTo(0,40);ctx.stroke();ctx.restore();});}
function drawClinic(progress,alpha){withAlpha(alpha,()=>{ctx.save();ctx.translate(960,560);const p=smooth(progress);setInk(2.6,P.ink);ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-260,-120,260,300,20);else ctx.rect(-260,-120,260,300);ctx.stroke();hCircle(-130,-180,60,31,3);hCircle(180,-160,55,33,3);hLine(140,180,240,180,34,1.6);ctx.beginPath();ctx.rect(60,-120,90,120);ctx.stroke();ctx.strokeStyle=P.inkSoft;ctx.lineWidth=1.2;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(70,-100+i*24);ctx.lineTo(140,-100+i*24);ctx.stroke();}ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';ctx.fillRect(-960,-560,1920,1080*(1-p));ctx.globalCompositeOperation='source-over';ctx.restore();});}
function drawSectionIcon(section,cx,cy,s,alpha,progress){withAlpha(alpha,()=>{ctx.save();ctx.translate(cx,cy);setInk(2.6,P.ink);const p=smooth(progress);if(section==='S0'){hCircle(0,0,s*0.55,1,3);hCircle(0,0,s*0.2,2,2);drawRay([[-s*1.3,-s*0.35],[-s*0.7,-s*0.2]],p,P.gold,2);drawRay([[-s*1.3,0],[-s*0.7,0]],p,P.gold,2);drawRay([[-s*1.3,s*0.35],[-s*0.7,s*0.2]],p,P.gold,2);}else if(section==='S1'){ctx.beginPath();ctx.rect(-s*0.6,-s*0.75,s*1.2,s*1.5);ctx.stroke();ctx.beginPath();ctx.rect(-s*0.25,-s*0.9,s*0.5,s*0.2);ctx.stroke();ctx.strokeStyle=P.inkSoft;ctx.lineWidth=1.6;for(let i=0;i<4;i++)hLine(-s*0.4,-s*0.4+i*s*0.28,s*0.4,-s*0.4+i*s*0.28,10+i,1.2);}else if(section==='S2'){ctx.beginPath();ctx.rect(-s*0.7,-s*0.7,s*1.0,s*1.4);ctx.stroke();hCircle(-s*0.2,-s*0.3,s*0.2,20,1.6);hLine(-s*0.5,s*0.2,s*0.1,s*0.2,21,1.2);hLine(-s*0.5,s*0.4,s*0.1,s*0.4,22,1.2);ctx.strokeStyle=P.green;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s*0.15,s*0.4);ctx.lineTo(s*0.35,s*0.6);ctx.lineTo(s*0.75,s*0.05);ctx.stroke();}else if(section==='S3'){drawCorneaArc(0,0,s*0.8,p,{highlight:true});setInk(2,P.inkSoft);hLine(-s*0.2,-s*0.9,s*0.2,-s*0.9,40,1.2);hLine(-s*0.2,-s*0.95,-s*0.2,-s*0.85,41,1);hLine(s*0.2,-s*0.95,s*0.2,-s*0.85,42,1);}else if(section==='S4'){ctx.beginPath();ctx.ellipse(0,-s*0.1,s*0.8,s*0.55,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-s*0.2,s*0.4);ctx.lineTo(-s*0.4,s*0.8);ctx.lineTo(0,s*0.5);ctx.closePath();ctx.stroke();}else if(section==='S5'){for(let i=0;i<5;i++){const w=s*(1.0-i*0.15);hLine(-w/2,-s*0.6+i*s*0.3,w/2,-s*0.6+i*s*0.3,50+i,1.4);}}else if(section==='S6'){ctx.beginPath();ctx.moveTo(-s*0.35,-s*0.5);ctx.lineTo(s*0.35,-s*0.5);ctx.lineTo(s*0.5,s*0.5);ctx.lineTo(-s*0.5,s*0.5);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(-s*0.2,-s*0.5);ctx.lineTo(-s*0.2,-s*0.9);ctx.lineTo(s*0.2,-s*0.9);ctx.lineTo(s*0.2,-s*0.5);ctx.stroke();ctx.beginPath();ctx.arc(0,s*0.85,s*0.15*p,0,Math.PI*2);ctx.fillStyle=P.blueDeep;ctx.fill();}else if(section==='S7'){ctx.beginPath();ctx.rect(-s*0.8,-s*0.7,s*1.6,s*1.4);ctx.stroke();setInk(2,P.inkSoft);for(let i=0;i<4;i++)hLine(-s*0.55,-s*0.4+i*s*0.3,s*0.55,-s*0.4+i*s*0.3,60+i,1.4);ctx.strokeStyle=P.green;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s*0.05,s*0.35);ctx.lineTo(s*0.3,s*0.55);ctx.lineTo(s*0.65,s*0.1);ctx.stroke();}ctx.restore();});}
window.Engine = { W,H,P,clamp01,phase,easeOut,smooth,mulberry32,wobble,hLine,hCircle,hEllipse,setInk,withAlpha,drawLabel,drawApple,drawHeadAndEye,drawCorneaArc,drawLens,drawRay,drawBrain,drawLattice,drawClouds,drawScatter,drawHazyScene,drawDevice,drawClinic,drawSectionIcon };
</script>
<script src="course_data.js"></script>
<script>
let CURRENT_UNIT = null;
window.setUnit = function(id){ CURRENT_UNIT = window.COURSE[id]; if(!CURRENT_UNIT) throw new Error('unknown unit: '+id); };
window.renderFrame = function(t){ ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = P.bg; ctx.fillRect(0,0,W,H); if(!CURRENT_UNIT) return; CURRENT_UNIT.render(ctx, t); };
window.setUnit(Object.keys(window.COURSE)[0]);
window.renderFrame(0);
</script>
</body></html>
